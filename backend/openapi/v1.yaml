components:
  schemas:
    AuditEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        occurredAtUtc: { type: string, format: date-time }
        employeeCode: { type: string, nullable: true }
        actorName: { type: string, nullable: true }
        httpMethod: { type: string }
        path: { type: string }
        statusCode: { type: integer }
    PagedAuditEvents:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        page: { type: integer }
        pageSize: { type: integer }
        totalCount: { type: integer }
    AuthUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        role: { type: string, enum: [hr, sup, staff, tbdh, shift_leader] }
        departmentId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        loginName: { type: string }
        departmentCode: { type: string }
        departmentName: { type: string }
        preferredLanguage: { type: string, enum: [vi, en] }
        mustChangePassword: { type: boolean }
    Flight:
      type: object
      properties:
        id: { type: string, format: uuid }
        weekId: { type: string }
        dayIdx: { type: integer }
        excelRowNo: { type: integer, description: Excel column NO }
        sortOrder: { type: integer, description: Row order within day (B-tree list index) }
        flightNo: { type: string, description: ARR FLT NO }
        departureFlightNo: { type: string, description: DEP FLT NO }
        registration: { type: string, description: REGS }
        route: { type: string }
        sta: { type: string }
        std: { type: string }
        eta: { type: string, nullable: true }
        etd: { type: string, nullable: true }
        etaDelayMinutes: { type: integer }
        etdDelayMinutes: { type: integer }
        delayMinutes: { type: integer }
        isDelayed: { type: boolean }
        belt: { type: string, description: BELT ARR }
        parking: { type: string, description: PRK }
        gate: { type: string }
        remark: { type: string }
        aircraft: { type: string }
        carry: { type: string }
        departmentCode: { type: string }
        manning: { type: integer }
        manningExplain: { type: string, nullable: true }
        isVip: { type: boolean }
    FlightScheduleDay:
      type: object
      properties:
        weekId: { type: string }
        dayIdx: { type: integer }
        sourceDayLabel: { type: string, nullable: true }
        sheetRemark: { type: string, nullable: true, description: Footer Remark block from Excel }
    FlightImportResult:
      type: object
      properties:
        importedCount: { type: integer }
        dayIdx: { type: integer }
        dayLabel: { type: string, nullable: true }
        sheetRemark: { type: string, nullable: true }
        warnings:
          type: array
          items: { type: string }
    FlightUpsert:
      type: object
      required: [dayIdx, flightNo, route, sta, std, departmentCode]
      properties:
        weekId: { type: string }
        dayIdx: { type: integer }
        flightNo: { type: string }
        departureFlightNo: { type: string }
        registration: { type: string }
        route: { type: string }
        sta: { type: string }
        std: { type: string }
        eta: { type: string }
        etd: { type: string }
        departmentCode: { type: string }
        manning: { type: integer }
        aircraft: { type: string }
        carry: { type: string }
        gate: { type: string }
        belt: { type: string }
        parking: { type: string }
        remark: { type: string }
        isVip: { type: boolean }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
